
syntax = "proto3";

package exv.vpn.v1;

import "exv/v1/common.proto";

// A connect request. The intent captures the full lookup key, request digest,
// and connection profile; any secret the scenario requires is carried as
// one-shot bytes and cleared immediately after it is admitted.
message ConnectRequest {
  ConnectIntent intent = 1;
  bytes secret_payload = 2;  // one-shot bytes, optional
  // Tag 3 was vacated by the R1 removal of `auto_install_service` (install/service
  // and connect are independent routes). Recorded as reserved per tag discipline;
  // never reused. See the R1 removal unfreeze record.
  reserved 3;
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// A response to an interaction prompt. Identifies the prompt by its
// interaction id and carries the user-provided material as one-shot bytes.
message InteractionResponse {
  bytes interaction_id = 1;  // 16 bytes
  bytes runtime_epoch = 2;   // 16 bytes
  bytes response_payload = 3;  // one-shot bytes
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// A stop request. Carries the full stop intent (lookup key + request digest).
message StopRequest {
  StopIntent intent = 1;
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// A reconcile request. Reconcile explicitly retries the current obligation in
// FailedDirty/Reconciling; it identifies the obligation by its lookup key.
message ReconcileRequest {
  OperationLookupKey key = 1;
  bytes request_digest = 2;  // 32 bytes
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// Lookup for KernelControl.GetOperation.
message GetKernelOperationRequest {
  OperationLookupKey key = 1;
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// Request for KernelControl.GetSnapshot.
message SnapshotRequest {
  bytes runtime_epoch = 1;  // 16 bytes, optional
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// Request for KernelControl.WatchEvents. The client may resume from a
// monotonic tick; an empty request starts from the current snapshot.
message WatchEventsRequest {
  uint64 resume_tick = 1;  // 0 means start from current snapshot
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// Kernel lifecycle control service. Maps to Architecture section 9.1.
// The acceptance controller must authenticate and hold a bootstrap capability
// before triggering connect/stop/reconcile or submitting a secret.
service KernelControl {
// Connect begins a connect attempt.
rpc Connect(ConnectRequest) returns (OperationReply);

// RespondInteraction answers an awaiting interaction prompt.
rpc RespondInteraction(InteractionResponse) returns (OperationReply);

// Stop is the only in-connection business cancellation.
rpc Stop(StopRequest) returns (OperationReply);

// Reconcile explicitly retries the current FailedDirty/Reconciling obligation.
rpc Reconcile(ReconcileRequest) returns (OperationReply);

// GetOperation returns the current state of a prior operation.
rpc GetOperation(GetKernelOperationRequest) returns (KernelOperationReply);

// GetSnapshot returns the current runtime snapshot.
rpc GetSnapshot(SnapshotRequest) returns (RuntimeSnapshot);

// WatchEvents streams runtime snapshots and transitions.
rpc WatchEvents(WatchEventsRequest) returns (stream RuntimeEvent);

// LogsList returns a page of aggregated log entries (incremental via after_seq;
// 0 returns the recent tail). Read path, not gate-gated.
rpc LogsList(LogsListRequest) returns (LogsListReply);

// LogsClear truncates the aggregated log file and resets the cursor.
rpc LogsClear(LogsClearRequest) returns (LogsClearReply);

// ConfigGet returns the current product configuration (non-secret fields only).
rpc ConfigGet(ConfigGetRequest) returns (ConfigPayload);

// ConfigSet applies and persists configuration items. Mutates state.
rpc ConfigSet(ConfigSetRequest) returns (ConfigReply);

// ServiceControl queries and mutates the win32 engine SCM service. The query
// action is a non-privileged read (SC_MANAGER_CONNECT + QUERY_*); the mutating
// actions (install/uninstall/start/stop) run as engine subcommands under the
// existing runas elevation boundary (D4) and are gate-gated (write path).
rpc ServiceControl(ServiceControlRequest) returns (ServiceControlReply);
}

// Request for KernelControl.LogsList. `after_seq` = 0 returns the recent tail;
// otherwise only entries with seq > after_seq. `limit` = 0 means the default;
// out-of-range is clamped. `filter` optionally matches level|message substring.
message LogsListRequest {
  uint64 after_seq = 1;
  uint32 limit = 2;
  string filter = 3;
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// Request for KernelControl.LogsClear.
message LogsClearRequest {
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// Request for KernelControl.ConfigGet.
message ConfigGetRequest {
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// Request for KernelControl.ConfigSet. Only non-secret keys are accepted.
message ConfigSetRequest {
  repeated ConfigItem items = 1;
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// ---------------------------------------------------------------------------
// Service control (KernelControl.ServiceControl; S3/D5)
// ---------------------------------------------------------------------------

// Request for KernelControl.ServiceControl. Exactly one action.
message ServiceControlRequest {
  oneof action {
    ServiceStatusQuery query = 1;     // read: current SCM service status (non-privileged)
    ServiceInstall install = 2;       // install/fix the engine SCM service (elevated)
    ServiceUninstall uninstall = 3;   // uninstall the engine SCM service (elevated)
    ServiceStart start = 4;           // start the engine SCM service (elevated)
    // ServiceStop (tag 5) removed 2026-08-22: the UI no longer initiates a stop;
    // a stopped service is a recoverable error state (start is the repair).
    ServiceRotateKey rotate_key = 6;  // rotate (revoke) the service PSK; elevated batch
  }
  reserved 5;  // ServiceStop (removed 2026-08-22; S3 service-control unfreeze record 2026-08-20)
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}

// Query the current SCM service status (no fields).
message ServiceStatusQuery {}

// Install (or fix) the engine SCM service. A reinstall rotates the PSK (M14).
message ServiceInstall {}

// Uninstall the engine SCM service.
message ServiceUninstall {}

// Start the engine SCM service.
message ServiceStart {}

message ServiceRotateKey {}

// Reply to KernelControl.ServiceControl. `service_status` is the post-action
// status (or the current status on query); `ok` reflects the action result and
// `message` carries a human-readable result/detail (no secrets, no stacks).
message ServiceControlReply {
  ServiceStatus service_status = 1;  // current status after the action (or on query)
  bool ok = 2;
  string message = 3;                // human-readable result/detail (no secrets)
  reserved 1000 to 1999;
  reserved 9000 to 9999;
}
