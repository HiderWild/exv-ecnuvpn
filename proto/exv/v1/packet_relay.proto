
syntax = "proto3";

package exv.vpn.v1;

import "exv/v1/common.proto";

// Direction of a packet batch relative to the tunneled peer.
// UNSPECIFIED is rejected by the strict converter.
enum PacketDirection {
  PACKET_DIRECTION_UNSPECIFIED = 0;
  PACKET_DIRECTION_INBOUND = 1;
  PACKET_DIRECTION_OUTBOUND = 2;
}

// A single opaque packet carried in a batch. The payload is opaque bytes; the
// strict converter enforces exact length bounds before the payload reaches the
// domain. No platform identity is self-reported.
message Packet {
  bytes payload = 1;          // opaque packet bytes
  uint32 length = 2;          // payload length in bytes
  uint64 monotonic_sequence = 3;  // per-direction monotonic sequence
  reserved 9000 to 9999;
}

// Mirrors domain PacketBatch. Binds the packet capability to a packet lease,
// opaque platform ownership, a direction, a monotonic sequence, packet count
// and total bytes. Carried over the dedicated packet data-plane connection.
message PacketBatch {
  PacketLeaseRef packet_lease = 1;      // opaque packet lease ref
  PlatformOwnershipRef platform_ownership = 2;  // opaque platform ownership
  PacketDirection direction = 3;
  uint64 monotonic_sequence = 4;        // batch-level monotonic sequence
  uint32 packet_count = 5;              // number of packets in this batch
  uint64 total_bytes = 6;               // sum of payload bytes in this batch
  repeated Packet packets = 7;          // the packets themselves
  reserved 9000 to 9999;
}

// The packet data-plane service. Scripted bidirectional relay of packet
// batches. Control and packet RPCs MUST use independent HTTP/2 connections.
// The packet capability is consumed atomically once by the resource owner.
service PacketRelay {
  // Bidirectional stream: inbound and outbound packet batches share the same
  // relay stream, tagged by direction on each batch.
  rpc Relay(stream PacketBatch) returns (stream PacketBatch);
}