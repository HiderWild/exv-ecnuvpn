
[package]
name = "exv-vpn-host"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
exv-vpn-cstp = { path = "../exv-vpn-cstp" }
exv-vpn-data-plane = { path = "../exv-vpn-data-plane" }
exv-vpn-domain = { path = "../exv-vpn-domain" }
exv-vpn-local-rpc = { path = "../exv-vpn-local-rpc" }
exv-vpn-resource = { path = "../exv-vpn-resource" }
exv-vpn-runtime = { path = "../exv-vpn-runtime" }
# W3-1/P1 S1a：event_bus 核心总线只依赖 wire 类型（RuntimeEvent/RuntimeStats），
# 不引入平台语义；win32 wrapper 与 darwin core 两侧同时消费。
exv-vpn-wire = { path = "../exv-vpn-wire" }
tokio.workspace = true
# BroadcastStream（broadcast 通道的 Stream 适配）需要 sync feature。
tokio-stream = { workspace = true, features = ["sync"] }
tracing.workspace = true

[lints]
workspace = true

