[package]
name = "exv-vpn-darwin-service-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "exv-vpn-darwin-service-agent"
