[package]
name = "exv-vpn-darwin-core"
version = "4.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
prost = "0.14.4"
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
log = "0.4.33"
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-platform-verifier = "0.7.0"
aes-gcm = "0.10.3"
base64 = "0.22.1"
exv-vpn-atrust = { path = "../../../../../common/rust/crates/exv-vpn-atrust" }
exv-vpn-darwin-ipc = { path = "../exv-vpn-darwin-ipc" }
# W3-1/P1 S2：WatchEvents 事件总线（common 上提核心；win32 wrapper 与 darwin 两侧消费）。
exv-vpn-host = { path = "../../../../../common/rust/crates/exv-vpn-host" }
exv-vpn-wire = { path = "../../../../../common/rust/crates/exv-vpn-wire" }
getrandom = "0.4"
libc = "0.2"
# C2 证书管理（agent_certs）：根 CA/叶子证书生成（纯 ring 封装，与 rustls 同生态）。
# 此前仅是测试依赖；转入生产依赖不改变 Cargo.lock 解析版本。
rcgen = "0.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
# C2 agent_certs：证书有效期日期运算（rcgen 的 OffsetDateTime 同源；锁定版本不变）。
time = "0.3"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# W3-1/P1 S2：watch_events 把总线订阅流 map(Ok) 成 tonic server-streaming。
tokio-stream = "0.1"
tonic = { version = "0.14.6", default-features = false, features = ["transport"] }
zeroize = "1.9"

[[bin]]
name = "exv-vpn-darwin-core"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
serde_json = "1.0.151"
