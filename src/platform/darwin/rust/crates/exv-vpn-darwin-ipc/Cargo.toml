[package]
name = "exv-vpn-darwin-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# M1（darwin aTrust 适配）：信封 V2 的 aTrust 网关/会话纯校验消费 Common
# （GatewayOrigin/BrowserSession），不在 darwin 重写解析器——依赖方向 Common ← 平台
# （win32-ipc 同款先例）。M2 engine 侧编排经本 crate re-export 复用同一类型。
exv-vpn-atrust = { path = "../../../../../common/rust/crates/exv-vpn-atrust" }
getrandom = "0.4"
hmac = "0.13"
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2"
sha2 = "0.11"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
zeroize = "1.9"

exv-vpn-wire = { path = "../../../../../common/rust/crates/exv-vpn-wire" }

[lints]
workspace = true
