
[workspace]
resolver = "3"
members = ["app"]

[profile.dev]
# 独立 Tauri workspace 同样关闭增量编译，确保 sccache 可以缓存 Rust 编译单元。
incremental = false

[profile.release]
# UI 独立按体积优化；Core/Engine 保持速度优化档位。
opt-level = "s"
lto = "thin"
codegen-units = 1

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"

# Tauri v2（独立 requirement 的独立依赖治理；版本由 tauri 2.x 线固定）。
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "custom-protocol"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"

# P4-b：core KernelControl gRPC client 依赖（与核心 workspace 同 0.14.x）。
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
http = "1.5.0"
hyper-util = "0.1.20"
tower = "0.5.3"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
sha2 = "0.11.0"
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# 复用 core 侧 proto 生成代码（KernelControl client + 全部 wire 消息）。Root workspace 成员。
# 相对路径：tauri/ → rust(..) → win32(../..) → platform(../../..) → src(../../../..) →
# 仓库根(../../../../..) → src/common/rust/crates/exv-vpn-wire。
exv-vpn-wire = { path = "../../../../../src/common/rust/crates/exv-vpn-wire" }
exv-vpn-win32-resource = { path = "../../../../../src/platform/win32/rust/crates/exv-vpn-win32-resource" }
exv-vpn-win32-config = { path = "../crates/exv-vpn-win32-config" }
zeroize = "1.9.0"
