
[package]
name = "exv-core"
version = "4.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
serde_json = { workspace = true }

[dependencies]
exv-vpn-atrust = { workspace = true }
exv-vpn-domain = { workspace = true }
exv-vpn-resource = { workspace = true }
exv-vpn-data-plane = { workspace = true }
exv-vpn-local-rpc = { workspace = true }
exv-vpn-cstp = { workspace = true }
exv-vpn-runtime = { workspace = true }
exv-vpn-host = { workspace = true }
exv-vpn-wire = { workspace = true }
exv-vpn-win32-config = { workspace = true }
exv-vpn-win32-ipc = { workspace = true }
exv-engine = { workspace = true }
exv-vpn-win32-resource = { workspace = true }
http = "1"
hyper-util = { version = "0.1.20", features = ["tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { workspace = true }
prost = { workspace = true }
tower = "0.5"
log = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Services", "Win32_Security_Cryptography"] }
zeroize = { workspace = true }
sha2 = { workspace = true }
tokio-tungstenite = "0.28"
futures-util = "0.3.34"
# S7 无头 CAS 链（atrust_cas_login）：双 origin HTTPS 定向跟随需要直连 TLS/HTTP 栈；
# 版本与 exv-vpn-atrust（AuthClient）同线，不引入新版本分叉。
base64 = { workspace = true }
bytes = { workspace = true }
hyper = { version = "1.11.0", features = ["client", "http1"] }
http-body-util = "0.1.4"
ring = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = "0.7.0"
tokio-rustls = { workspace = true }

[lints]
workspace = true

