tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }
exv-vpn-domain = { workspace = true }
exv-vpn-resource = { workspace = true }
exv-vpn-data-plane = { workspace = true }
exv-vpn-local-rpc = { workspace = true }
exv-vpn-wire = { workspace = true }
exv-vpn-win32-ipc = { workspace = true }
exv-vpn-win32-config = { workspace = true }
exv-vpn-win32-resource = { workspace = true }
hyper-util = "0.1.20"
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Services", "Win32_System_RemoteDesktop", "Win32_System_Environment"] }
windows-service = "0.8"
zeroize = { workspace = true }

