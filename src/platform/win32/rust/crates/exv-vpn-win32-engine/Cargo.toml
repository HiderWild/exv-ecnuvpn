
[package]
name = "exv-engine"
version = "4.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
serde_json = { workspace = true }

[dependencies]
base64 = { workspace = true }
exv-vpn-cstp = { workspace = true }
